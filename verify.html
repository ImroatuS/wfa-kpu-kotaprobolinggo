<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Verifikasi Wajah WFA</title>

  <script
    src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js">
  </script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      margin: 0;
      padding: 30px;
      color: #333;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      color: #e31e24;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    .camera-box {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    video {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      background: #111;
      display: block;
      margin: auto;
      transform: scaleX(-1);
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      min-height: 24px;
    }

    #hasil {
      margin-top: 15px;
      font-size: 22px;
      font-weight: bold;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>VERIFIKASI WAJAH</h1>

    <div class="subtitle">
      KPU Kota Probolinggo
    </div>

    <div
      id="emailPegawai"
      style="
        margin-bottom: 20px;
        font-size: 13px;
        color: #777;
      "
    ></div>

    <div class="camera-box">

      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

      <div id="status">
        Memuat sistem...
      </div>

      <div id="hasil"></div>

    </div>

  </div>


  <script>

    // =====================================
    // PARAMETER EMAIL
    // =====================================

    const parameter =
      new URLSearchParams(
        window.location.search
      );


    const emailPegawai =
      parameter.get("email");


    document
      .getElementById("emailPegawai")
      .textContent =
      emailPegawai
        ? "Akun: " + emailPegawai
        : "Akun tidak ditemukan";


    console.log(
      "Email pegawai:",
      emailPegawai
    );


    let sudahTerverifikasi =
      false;


    const video =
      document.getElementById("video");


    const status =
      document.getElementById("status");


    const hasilTeks =
      document.getElementById("hasil");


    // =====================================
    // URL APPS SCRIPT
    // =====================================

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzjv57BO6fvklm9gjY9VPlV4pMgtJeejMEFGUCN6Vw1LZ6RoVLOEzVd--hHho2-fwff/exec";


    // =====================================
    // LOAD MODEL
    // =====================================

    async function loadModel() {

      status.textContent =
        "Memuat sistem...";


      try {

        const MODEL_URL =
          "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";


        status.textContent =
          "Memuat model 1/3...";


        await faceapi.nets
          .tinyFaceDetector
          .loadFromUri(
            MODEL_URL
          );


        status.textContent =
          "Memuat model 2/3...";


        await faceapi.nets
          .faceLandmark68Net
          .loadFromUri(
            MODEL_URL
          );


        status.textContent =
          "Memuat model 3/3...";


        await faceapi.nets
          .faceRecognitionNet
          .loadFromUri(
            MODEL_URL
          );


        status.textContent =
          "Sistem siap. Membuka kamera...";


        bukaKamera();

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "Gagal memuat sistem: " +
          error.message;

      }

    }


    // =====================================
    // BUKA KAMERA
    // =====================================

    async function bukaKamera() {

      try {

        const stream =
          await navigator.mediaDevices
            .getUserMedia({

              video: {
                facingMode: "user"
              },

              audio: false

            });


        video.srcObject =
          stream;


        status.textContent =
          "Kamera aktif. Mengambil data wajah...";


        ambilDescriptorDariServer();

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "Kamera gagal: " +
          error.name;

      }

    }


    // =====================================
    // AMBIL DESCRIPTOR DARI APPS SCRIPT
    // =====================================

    function ambilDescriptorDariServer() {

      if (!emailPegawai) {

        status.textContent =
          "Email pegawai tidak ditemukan.";

        return;

      }


      status.textContent =
        "Mengambil data wajah terdaftar...";


      // Nama callback dibuat unik
      const callbackName =
        "faceCallback_" +
        Date.now();


      // Fungsi callback yang akan dipanggil
      // oleh Apps Script

      window[callbackName] =
        function(data) {

          console.log(
            "DATA WAJAH DARI SERVER:",
            data
          );


          // Hapus script setelah selesai
          const script =
            document.getElementById(
              callbackName
            );

          if (script) {
            script.remove();
          }


          // Hapus callback
          delete window[callbackName];


          if (
            !data ||
            !data.success
          ) {

            status.textContent =
              data &&
              data.error
                ? data.error
                : "Gagal mengambil data wajah.";

            return;

          }


          if (
            !Array.isArray(
              data.descriptor
            )
          ) {

            status.textContent =
              "Data wajah tidak valid.";

            return;

          }


          if (
            data.descriptor.length !== 128
          ) {

            status.textContent =
              "Data wajah tidak valid (bukan 128 angka).";

            console.error(
              "Descriptor length:",
              data.descriptor.length
            );

            return;

          }


          console.log(
            "✓ Descriptor berhasil diambil dari Google Sheets"
          );


          mulaiVerifikasi(
            data.descriptor
          );

        };


      // Buat script JSONP
      const script =
        document.createElement("script");


      script.id =
        callbackName;


      script.src =
        APPS_SCRIPT_URL +
        "?email=" +
        encodeURIComponent(
          emailPegawai
        ) +
        "&callback=" +
        encodeURIComponent(
          callbackName
        );


      script.onerror =
        function() {

          console.error(
            "Gagal mengambil descriptor dari Apps Script."
          );


          status.textContent =
            "Gagal mengambil data wajah dari server.";

          delete window[callbackName];

        };


      document
        .body
        .appendChild(script);

    }


    // =====================================
    // MULAI VERIFIKASI WAJAH
    // =====================================

    function mulaiVerifikasi(
      descriptorData
    ) {

      try {

        const descriptorArray =
          new Float32Array(
            descriptorData
          );


        const wajahTerdaftar =
          new faceapi
            .LabeledFaceDescriptors(
              "Wajah Terdaftar",
              [descriptorArray]
            );


        const faceMatcher =
          new faceapi.FaceMatcher(
            wajahTerdaftar,
            0.6
          );


        console.log(
          "✓ FaceMatcher siap"
        );


        status.textContent =
          "Kamera aktif. Posisikan wajah di tengah.";


        setInterval(
          async function() {

            if (
              video.readyState < 2
            ) {

              return;

            }


            try {

              const hasil =
                await faceapi
                  .detectSingleFace(
                    video,
                    new faceapi
                      .TinyFaceDetectorOptions({
                        inputSize: 320,
                        scoreThreshold: 0.5
                      })
                  )
                  .withFaceLandmarks()
                  .withFaceDescriptor();


              if (!hasil) {

                status.textContent =
                  "👤 Mencari wajah...";

                hasilTeks.textContent =
                  "";

                return;

              }


              const kecocokan =
                faceMatcher.findBestMatch(
                  hasil.descriptor
                );


              console.log(
                "HASIL:",
                kecocokan.label,
                "DISTANCE:",
                kecocokan.distance
              );


              if (
                kecocokan.label !== "unknown"
              ) {

                status.textContent =
                  "✓ Wajah cocok";


                hasilTeks.textContent =
                  "✓ WAJAH TERVERIFIKASI";


                if (
                  !sudahTerverifikasi
                ) {

                  sudahTerverifikasi =
                    true;


                  if (
                    window.opener
                  ) {

                    window.opener.postMessage(
                      {
                        type:
                          "FACE_VERIFIED"
                      },
                      "*"
                    );

                  }

                }

              }

              else {

                status.textContent =
                  "Wajah terdeteksi, tetapi tidak cocok.";


                hasilTeks.textContent =
                  "✕ WAJAH TIDAK COCOK";

              }

            }

            catch (error) {

              console.error(
                "VERIFIKASI ERROR:",
                error
              );


              status.textContent =
                "Gagal: " +
                error.message;

            }

          },
          1000
        );

      }

      catch (error) {

        console.error(
          "FACE MATCHER ERROR:",
          error
        );


        status.textContent =
          "Gagal menyiapkan verifikasi.";

      }

    }


    // =====================================
    // START
    // =====================================

    loadModel();

  </script>

</body>

</html>

<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Verifikasi Wajah WFA</title>

  <script
    src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js">
  </script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      margin: 0;
      padding: 30px;
      color: #333;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      color: #e31e24;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    .camera-box {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    video {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      background: #111;
      display: block;
      margin: auto;
      transform: scaleX(-1);
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      min-height: 24px;
    }

    #hasil {
      margin-top: 15px;
      font-size: 22px;
      font-weight: bold;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>VERIFIKASI WAJAH</h1>

    <div class="subtitle">
      KPU Kota Probolinggo
    </div>

    <div class="camera-box">

      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

      <div id="status">
        Memuat sistem...
      </div>

      <div id="hasil"></div>

    </div>

  </div>


  <script>

    const video =
      document.getElementById("video");

    const status =
      document.getElementById("status");

    const hasilTeks =
      document.getElementById("hasil");


    // =====================================
    // LOAD MODEL
    // =====================================

    async function loadModel() {

      status.textContent =
        "Memuat sistem...";

      try {

        const MODEL_URL =
          "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";


        status.textContent =
          "Memuat model 1/3...";

        await faceapi.nets.tinyFaceDetector.loadFromUri(
          MODEL_URL
        );


        status.textContent =
          "Memuat model 2/3...";

        await faceapi.nets.faceLandmark68Net.loadFromUri(
          MODEL_URL
        );


        status.textContent =
          "Memuat model 3/3...";

        await faceapi.nets.faceRecognitionNet.loadFromUri(
          MODEL_URL
        );


        status.textContent =
          "Sistem siap. Membuka kamera...";


        bukaKamera();

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "Gagal memuat sistem: " +
          error.message;

      }

    }


    // =====================================
    // BUKA KAMERA
    // =====================================

    async function bukaKamera() {

      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: "user"
            },

            audio: false

          });


        video.srcObject =
          stream;


        status.textContent =
          "Kamera aktif. Posisikan wajah di tengah.";


        tungguWajah();

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "Kamera gagal: " +
          error.name;

      }

    }


    // =====================================
    // VERIFIKASI
    // =====================================

    async function tungguWajah() {

      const descriptorTersimpan =
        localStorage.getItem(
          "faceDescriptorTest"
        );


      if (!descriptorTersimpan) {

        status.textContent =
          "Belum ada wajah yang terdaftar.";

        return;

      }


      const descriptorArray =
        new Float32Array(
          JSON.parse(descriptorTersimpan)
        );


      const wajahTerdaftar =
        new faceapi.LabeledFaceDescriptors(
          "Wajah Terdaftar",
          [descriptorArray]
        );


      const faceMatcher =
        new faceapi.FaceMatcher(
          wajahTerdaftar,
          0.6
        );


      setInterval(async function() {

        if (video.readyState < 2) {
          return;
        }


        try {

          const hasil =
            await faceapi
              .detectSingleFace(
                video,
                new faceapi.TinyFaceDetectorOptions({
                  inputSize: 320,
                  scoreThreshold: 0.5
                })
              )
              .withFaceLandmarks()
              .withFaceDescriptor();


          if (!hasil) {

            status.textContent =
              "👤 Mencari wajah...";

            hasilTeks.textContent =
              "";

            return;

          }


          const kecocokan =
            faceMatcher.findBestMatch(
              hasil.descriptor
            );


          console.log(
            "HASIL:",
            kecocokan.label,
            "DISTANCE:",
            kecocokan.distance
          );


          if (
            kecocokan.label !== "unknown"
          ) {

            status.textContent =
              "✓ Wajah cocok";

            hasilTeks.textContent =
              "✓ WAJAH TERVERIFIKASI";

          }

          else {

            status.textContent =
              "Wajah terdeteksi, tetapi tidak cocok.";

            hasilTeks.textContent =
              "✕ WAJAH TIDAK COCOK";

          }

        }

        catch (error) {

          console.error(
            "VERIFIKASI ERROR:",
            error
          );

          status.textContent =
            "Gagal: " + error.message;

        }

      }, 1000);

    }


    // =====================================
    // START
    // =====================================

    loadModel();

  </script>

</body>

</html>

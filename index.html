<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Verifikasi Wajah WFA</title>

  <!-- face-api.js -->
  <script
    src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js">
  </script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      margin: 0;
      padding: 30px;
      color: #333;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      color: #e31e24;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    .camera-box {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    video {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      background: #111;
      display: block;
      margin: auto;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #e31e24;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>VERIFIKASI WAJAH</h1>

    <div class="subtitle">
      KPU Kota Probolinggo
    </div>

    <div class="camera-box">

      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

      <div id="status">
        Memuat sistem...
      </div>

      <button
        id="btnKamera"
        onclick="bukaKamera()"
        disabled
      >
        MEMUAT...
      </button>

    </div>

  </div>

  <script>

    const video =
      document.getElementById("video");

    const status =
      document.getElementById("status");

    const tombol =
      document.getElementById("btnKamera");


    // ==================================
    // LOAD MODEL FACE DETECTOR
    // ==================================

    async function loadModel() {

      status.textContent =
        "Memuat sistem deteksi wajah...";

      try {

        await faceapi.nets.tinyFaceDetector.loadFromUri(
          "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights"
        );

        status.textContent =
          "Sistem siap.";

        tombol.disabled = false;

        tombol.textContent =
          "📷 AKTIFKAN KAMERA";

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "Gagal memuat sistem deteksi wajah.";

        tombol.textContent =
          "COBA MUAT ULANG";

      }

    }


    // ==================================
    // BUKA KAMERA
    // ==================================

    async function bukaKamera() {

      tombol.disabled = true;

      status.textContent =
        "Meminta izin kamera...";

      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "user"
            },
            audio: false
          });

        video.srcObject =
          stream;

        status.textContent =
          "Kamera aktif. Mencari wajah...";

        tombol.style.display =
          "none";

        mulaiDeteksi();

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "Kamera gagal: " +
          error.name;

        tombol.disabled = false;

        tombol.textContent =
          "📷 COBA LAGI";

      }

    }


    // ==================================
    // DETEKSI WAJAH
    // ==================================

    function mulaiDeteksi() {

      setInterval(async function() {

        if (
          video.readyState <
          2
        ) {
          return;
        }

        const hasil =
          await faceapi.detectAllFaces(
            video,
            new faceapi.TinyFaceDetectorOptions({
              inputSize: 320,
              scoreThreshold: 0.5
            })
          );


        if (
          hasil.length === 0
        ) {

          status.textContent =
            "👤 Wajah belum terdeteksi.";

        }

        else if (
          hasil.length === 1
        ) {

          status.textContent =
            "✓ WAJAH TERDETEKSI";

        }

        else {

          status.textContent =
            "⚠ Terdeteksi lebih dari satu wajah.";

        }

      }, 500);

    }


    // ==================================
    // MULAI
    // ==================================

    loadModel();

  </script>

</body>

</html>

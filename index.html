<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Registrasi Wajah WFA</title>

  <script
    src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js">
  </script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      margin: 0;
      padding: 30px;
      color: #333;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      color: #e31e24;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    .camera-box {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    video {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      background: #111;
      display: block;
      margin: auto;
      transform: scaleX(-1);
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #e31e24;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>REGISTRASI WAJAH</h1>

    <div class="subtitle">
      KPU Kota Probolinggo
    </div>

    <div class="camera-box">

      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

      <div id="status">
        Memuat sistem...
      </div>

      <button
        id="btnKamera"
        onclick="bukaKamera()"
        disabled
      >
        MEMUAT...
      </button>

      <button
        id="btnDaftar"
        onclick="daftarWajah()"
        style="display:none;"
      >
        DAFTARKAN WAJAH
      </button>

    </div>

  </div>


  <script>

    const video =
      document.getElementById("video");

    const status =
      document.getElementById("status");

    const btnKamera =
      document.getElementById("btnKamera");

    const btnDaftar =
      document.getElementById("btnDaftar");


    // =====================================
    // LOAD MODEL
    // =====================================

    async function loadModel() {

      status.textContent =
        "Memuat sistem...";
    
      try {
    
        const MODEL_URL =
          "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";
    
    
        status.textContent =
          "Memuat model 1/3...";
    
        await faceapi.nets.tinyFaceDetector.loadFromUri(
          MODEL_URL
        );
    
    
        status.textContent =
          "Memuat model 2/3...";
    
        await faceapi.nets.faceLandmark68Net.loadFromUri(
          MODEL_URL
        );
    
    
        status.textContent =
          "Memuat model 3/3...";
    
        await faceapi.nets.faceRecognitionNet.loadFromUri(
          MODEL_URL
        );
    
    
        status.textContent =
          "Sistem siap.";
    
        btnKamera.disabled =
          false;
    
        btnKamera.textContent =
          "📷 AKTIFKAN KAMERA";
    
      }
    
      catch (error) {
    
        console.error(error);
    
        status.textContent =
          "Gagal: " + error.message;
    
        console.error(
          "MODEL ERROR:",
          error
        );
    
      }
    
    }

    // =====================================
    // BUKA KAMERA
    // =====================================

    async function bukaKamera() {

      btnKamera.disabled =
        true;

      status.textContent =
        "Meminta izin kamera...";

      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: "user"
            },

            audio: false

          });


        video.srcObject =
          stream;


        btnKamera.style.display =
          "none";


        status.textContent =
          "Kamera aktif. Posisikan wajah di tengah.";


        tungguWajah();

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "Kamera gagal: " +
          error.name;

        btnKamera.disabled =
          false;

        btnKamera.textContent =
          "📷 COBA LAGI";

      }

    }


    // =====================================
    // TUNGGU SATU WAJAH
    // =====================================

    function tungguWajah() {

      const interval =
        setInterval(async function() {

          if (
            video.readyState < 2
          ) {
            return;
          }


          const hasil =
            await faceapi
              .detectAllFaces(
                video,
                new faceapi.TinyFaceDetectorOptions({
                  inputSize: 320,
                  scoreThreshold: 0.5
                })
              )
              .withFaceLandmarks();


          if (
            hasil.length === 0
          ) {

            status.textContent =
              "👤 Wajah belum terdeteksi.";

            btnDaftar.style.display =
              "none";

          }

          else if (
            hasil.length === 1
          ) {

            status.textContent =
              "✓ Wajah terdeteksi. Siap didaftarkan.";

            btnDaftar.style.display =
              "block";

          }

          else {

            status.textContent =
              "⚠ Hanya boleh ada satu wajah.";

            btnDaftar.style.display =
              "none";

          }

        }, 500);

    }


    // =====================================
    // AMBIL FACE DESCRIPTOR
    // =====================================

    async function daftarWajah() {

      btnDaftar.disabled = true;
    
      status.textContent =
        "Mencari wajah...";
    
      try {
    
        const hasil =
          await faceapi
            .detectSingleFace(
              video,
              new faceapi.TinyFaceDetectorOptions({
                inputSize: 320,
                scoreThreshold: 0.5
              })
            )
            .withFaceLandmarks();
    
        if (!hasil) {
    
          status.textContent =
            "Wajah tidak terbaca. Coba lagi.";
    
          btnDaftar.disabled = false;
    
          return;
        }
    
    
        status.textContent =
          "Wajah ditemukan. Membaca karakteristik...";
    
    
        const descriptor =
          await faceapi.computeFaceDescriptor(hasil);
    
    
        console.log(
          "DESCRIPTOR BERHASIL:",
          descriptor
        );
    
    
        status.textContent =
          "Karakteristik wajah berhasil dibaca.";
    
    
        const descriptorArray =
          Array.from(descriptor);
    
    
        localStorage.setItem(
          "faceDescriptorTest",
          JSON.stringify(descriptorArray)
        );
    
    
        console.log(
          "DESCRIPTOR TERSIMPAN:",
          descriptorArray
        );
    
    
        status.textContent =
          "✓ WAJAH BERHASIL DIDAFTARKAN";
    
    
        btnDaftar.disabled =
          false;
    
    
        btnDaftar.textContent =
          "✓ WAJAH SUDAH TERDAFTAR";
    
    
      }
    
      catch (error) {
    
        console.error(
          "REGISTRASI ERROR:",
          error
        );
    
    
        status.textContent =
          "Gagal: " + error.message;
    
    
        btnDaftar.disabled =
          false;
    
      }
    
    }


    // =====================================
    // START
    // =====================================

    loadModel();

  </script>

</body>

</html>
